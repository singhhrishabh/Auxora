<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auxora UAE — AI Banking Bridge</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0d0d0d;--surface:#161616;--surface2:#1e1e1e;--surface3:#252525;--border:#2a2a2a;--border2:#333;--text:#e8e8e8;--text2:#a0a0a0;--text3:#666;--blue:#3b82f6;--blue-lt:#1d3557;--blue-bg:#0f1f35;--green:#22c55e;--green-bg:#0f2818;--amber:#f59e0b;--amber-bg:#1f1500;--red:#ef4444;--red-bg:#1f0a0a;--radius:10px;--radius-sm:6px}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;font-size:14px;line-height:1.5;min-height:100vh;display:flex;flex-direction:column}
.header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:100}
.logo{font-size:18px;font-weight:600;letter-spacing:-0.3px;color:var(--text);text-decoration:none}
.logo span{color:var(--blue)}
.logo sub{font-size:10px;font-weight:400;color:var(--text3);vertical-align:middle;margin-left:4px}
.hdr-r{display:flex;align-items:center;gap:10px}
.lang-row{display:flex;gap:5px;flex-wrap:wrap}
.lang-btn{padding:4px 10px;border-radius:99px;border:1px solid var(--border2);background:var(--surface2);color:var(--text2);font-size:11px;cursor:pointer;transition:all .15s;font-family:inherit}
.lang-btn:hover{border-color:var(--blue);color:var(--blue)}
.lang-btn.active{background:var(--blue);border-color:var(--blue);color:#fff}
.api-row{display:flex;gap:4px;align-items:center}
.api-sel{padding:4px 8px;border-radius:6px;border:1px solid var(--border2);background:var(--surface2);color:var(--text2);font-size:11px;font-family:inherit;cursor:pointer;outline:none}
.api-key{padding:4px 8px;border-radius:6px;border:1px solid var(--border2);background:var(--surface2);color:var(--text);font-size:11px;width:110px;font-family:inherit;display:none;outline:none}
.api-sv{padding:4px 10px;border-radius:6px;border:1px solid var(--border2);background:var(--surface2);color:var(--text2);font-size:11px;cursor:pointer;font-family:inherit;transition:all .15s}
.api-sv:hover{border-color:var(--blue);color:var(--blue)}
.main{flex:1;display:flex;flex-direction:column;max-width:860px;width:100%;margin:0 auto;padding:0 20px}
#homeScreen{display:flex;flex-direction:column;padding-bottom:80px}
#chatScreen{display:none;flex-direction:column;flex:1}
.greeting-card{margin:20px 0 18px;padding:16px 20px;background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--blue);border-radius:var(--radius);font-size:14px;color:var(--text2);line-height:1.6}
.sec-label{font-size:11px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;color:var(--text3);margin-bottom:10px}
.persona-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.persona-btn{display:flex;flex-direction:column;align-items:center;gap:5px;padding:12px 14px;border-radius:var(--radius);border:1px solid var(--border2);background:var(--surface);color:var(--text2);font-size:12px;cursor:pointer;transition:all .15s;font-family:inherit;min-width:80px;flex:1}
.persona-btn .ico{font-size:20px}
.persona-btn:hover{border-color:var(--blue);color:var(--text)}
.persona-btn.active{border-color:var(--blue);background:var(--blue-bg);color:var(--blue)}
.search-input{width:100%;padding:12px 16px;background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius);color:var(--text);font-size:14px;font-family:inherit;outline:none;transition:border-color .15s;margin-bottom:18px}
.search-input:focus{border-color:var(--blue)}
.search-input::placeholder{color:var(--text3)}
.quick-topics{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.topic-btn{padding:6px 14px;border-radius:99px;border:1px solid var(--border2);background:var(--surface);color:var(--text2);font-size:12px;cursor:pointer;transition:all .15s;font-family:inherit}
.topic-btn:hover{border-color:var(--blue);color:var(--blue)}
.topic-btn.active{background:var(--blue);border-color:var(--blue);color:#fff}
.service-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:10px;margin-bottom:18px}
.service-card{padding:16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;transition:all .15s;text-align:left}
.service-card:hover{border-color:var(--blue);background:var(--surface2)}
.service-card .s-ico{font-size:18px;margin-bottom:8px;display:block}
.service-card .s-name{font-size:13px;font-weight:500;color:var(--text);margin-bottom:3px}
.service-card .s-desc{font-size:11px;color:var(--text3)}
.chat-topbar{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--border)}
.back-btn{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:var(--radius-sm);border:1px solid var(--border2);background:var(--surface);color:var(--text2);font-size:12px;cursor:pointer;font-family:inherit;transition:all .15s}
.back-btn:hover{border-color:var(--blue);color:var(--blue)}
.chat-title{font-size:14px;font-weight:500;color:var(--text)}
.chat-badge{margin-left:auto;font-size:10px;padding:2px 8px;border-radius:99px;background:var(--blue-bg);color:var(--blue);border:1px solid var(--blue-lt)}
.messages{flex:1;overflow-y:auto;padding:20px 0;display:flex;flex-direction:column;gap:16px;min-height:0;max-height:calc(100vh - 260px)}
.messages::-webkit-scrollbar{width:4px}
.messages::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
.msg{display:flex;gap:10px;max-width:100%}
.msg.user{flex-direction:row-reverse}
.avatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0;margin-top:2px}
.avatar.ai{background:var(--blue);color:#fff}
.avatar.u{background:var(--surface2);border:1px solid var(--border2);color:var(--text2)}
.bubble{padding:11px 15px;border-radius:12px;font-size:13.5px;line-height:1.65;max-width:82%}
.bubble.ai{background:var(--surface);border:1px solid var(--border);border-radius:4px 12px 12px 12px;color:var(--text)}
.bubble.ai strong{color:var(--text);font-weight:600}
.bubble.u{background:var(--blue);color:#fff;border-radius:12px 4px 12px 12px}
.typing-dots{display:flex;align-items:center;gap:4px;padding:4px 0}
.typing-dots span{width:6px;height:6px;border-radius:50%;background:var(--text3);animation:pulse 1.2s infinite}
.typing-dots span:nth-child(2){animation-delay:.2s}
.typing-dots span:nth-child(3){animation-delay:.4s}
@keyframes pulse{0%,80%,100%{opacity:.2}40%{opacity:1}}
.input-bar{display:flex;align-items:flex-end;gap:8px;padding:12px 0 20px;position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--border)}
.input-wrap{flex:1;display:flex;align-items:center;background:var(--surface);border:1px solid var(--border2);border-radius:10px;padding:0 12px;transition:border-color .15s}
.input-wrap:focus-within{border-color:var(--blue)}
.chat-input{flex:1;border:none;background:transparent;color:var(--text);font-size:13.5px;font-family:inherit;outline:none;padding:11px 0;resize:none;max-height:120px;overflow-y:auto}
.chat-input::placeholder{color:var(--text3)}
.send-btn{width:36px;height:36px;border-radius:8px;background:var(--blue);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s}
.send-btn:hover{background:#2563eb}
.send-btn:disabled{background:var(--surface2);cursor:not-allowed}
.send-btn svg{width:16px;height:16px}
.suggest-row{display:flex;gap:6px;flex-wrap:wrap;padding:10px 0 4px}
.suggest-chip{padding:5px 12px;border-radius:99px;border:1px solid var(--border2);background:var(--surface2);color:var(--text2);font-size:12px;cursor:pointer;font-family:inherit;transition:all .12s}
.suggest-chip:hover{border-color:var(--blue);color:var(--blue)}
.step-list{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.step-item{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--text2)}
.step-num{width:20px;height:20px;border-radius:50%;background:var(--blue-bg);color:var(--blue);font-size:10px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}

/* ── Scanner UI ── */
.upload-btn{background:none;border:none;cursor:pointer;padding:6px;display:flex;align-items:center;justify-content:center;color:var(--text3);transition:color .15s;flex-shrink:0}
.upload-btn:hover{color:var(--blue)}
.upload-btn svg{width:18px;height:18px}
.scan-card{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:14px;margin-top:8px;font-size:12.5px}
.scan-card .scan-header{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-weight:600;font-size:13px;color:var(--text)}
.scan-card .scan-type-badge{font-size:10px;padding:2px 8px;border-radius:99px;font-weight:600}
.scan-badge-pass{background:#0f2818;color:#22c55e;border:1px solid #166534}
.scan-badge-warn{background:#1f1500;color:#f59e0b;border:1px solid #92400e}
.scan-badge-fail{background:#1f0a0a;color:#ef4444;border:1px solid #991b1b}
.scan-fields{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin-bottom:10px}
.scan-field{display:flex;flex-direction:column;gap:1px}
.scan-field-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.scan-field-value{font-size:12.5px;color:var(--text);font-weight:500}
.scan-checks{display:flex;flex-direction:column;gap:4px;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
.scan-check{display:flex;align-items:center;gap:6px;font-size:11.5px}
.scan-check-icon{width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;flex-shrink:0}
.sc-pass{background:#0f2818;color:#22c55e}
.sc-warn{background:#1f1500;color:#f59e0b}
.sc-fail{background:#1f0a0a;color:#ef4444}
.scan-progress{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--surface);border:1px solid var(--border);border-radius:8px;font-size:12px;color:var(--text2)}
.scan-spinner{width:14px;height:14px;border:2px solid var(--border2);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="header">
  <a href="index.html" class="logo">Au<span>xo</span>ra<sub>UAE</sub></a>
  <div class="hdr-r">
    <div class="lang-row">
      <button class="lang-btn active" id="lEN">EN</button>
      <button class="lang-btn" id="lAR">عربي</button>
      <button class="lang-btn" id="lHI">हिंदी</button>
      <button class="lang-btn" id="lUR">اردو</button>
      <button class="lang-btn" id="lML">മലയാളം</button>
    </div>
    <div class="api-row">
      <select class="api-sel" id="apiProv">
        <option value="local">Built-in</option>
        <option value="gemini">Gemini</option>
        <option value="openai">OpenAI</option>
      </select>
      <input type="password" class="api-key" id="apiKey" placeholder="API Key">
      <button class="api-sv" id="apiSv">Save</button>
    </div>
  </div>
</div>
<div class="main">
  <div id="homeScreen">
    <div class="greeting-card" id="greetCard">Hello! I am Auxora, your active UAE banking bridge. I collect your information, verify documents, fill forms, write bank emails, and guide every step. Tell me your problem or choose below.</div>
    <div class="sec-label">WHO ARE YOU?</div>
    <div class="persona-row" id="pRow"></div>
    <input class="search-input" id="searchIn" placeholder="Describe your problem... e.g. salary not paid, send money home" autocomplete="off">
    <div class="sec-label">QUICK TOPICS</div>
    <div class="quick-topics" id="qTopics"></div>
    <div class="sec-label">CHOOSE A SERVICE</div>
    <div class="service-grid" id="sGrid"></div>
  </div>
  <div id="chatScreen">
    <div class="chat-topbar">
      <button class="back-btn" id="backBtn">&#8592; Back</button>
      <span class="chat-title">Auxora UAE</span>
      <span class="chat-badge">AI Bridge</span>
    </div>
    <div class="suggest-row" id="sugRow"></div>
    <div class="messages" id="msgs"></div>
    <input type="file" id="docFileInput" accept=".pdf,.jpg,.jpeg,.png,.webp" style="display:none">
    <div class="input-bar">
      <div class="input-wrap">
        <button class="upload-btn" id="uploadBtn" title="Upload document for scanning">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
        </button>
        <textarea class="chat-input" id="chatIn" rows="1" placeholder="Ask anything or upload a document..."></textarea>
      </div>
      <button class="send-btn" id="sendBtn">
        <svg viewBox="0 0 16 16" fill="none"><path d="M1.5 8H14.5M10 3.5L14.5 8L10 12.5" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>
</div>
<script src="doc-scanner.js"></script>
<script src="auxora-engine.js"></script>
</body>
</html>
